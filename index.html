<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Private flashcards that stay in your browser.">
<title>flipdeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect x='1.5' y='1' width='5' height='6' rx='1' fill='none' stroke='%23888'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="print.css" media="print">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="chrome top">
  <div class="wrap row">
    <a class="brand" href="#/">flipdeck</a>
    <span class="grow"></span>
    <button type="button" class="btn quiet" id="open-ro" title="Open a file and study it without saving">Open file</button>
    <button type="button" class="btn" id="import">Import</button>
  </div>
</header>

<div id="notice" class="chrome wrap" role="region" aria-label="Messages"></div>
<main id="main" class="chrome wrap" tabindex="-1">
  <noscript><p>flipdeck needs JavaScript.</p></noscript>
</main>

<div id="print" aria-hidden="true"></div>
<div id="live" class="sr" aria-live="polite"></div>
<div id="drop" hidden><p>Drop a .json or .md file to import</p></div>
<input type="file" id="file" accept=".json,.md,.markdown,.txt,application/json,text/markdown,text/plain" multiple hidden>

<script type="module" src="js/app.js"></script>
<script data-goatcounter="https://yvj.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</body>
</html>
